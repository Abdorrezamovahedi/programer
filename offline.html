<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00e676">
<meta name="robots" content="noindex,nofollow">
<title>اینترنت قطع است | MCD Code Up</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: Tahoma, system-ui, sans-serif;
    background: #020805;
    color: #e8f5e9;
    line-height: 1.9;
  }
  .box {
    width: 100%;
    max-width: 420px;
    border: 1px solid #1f3d2e;
    border-radius: 16px;
    background: #07140e;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(0,230,118,0.08), 0 16px 40px rgba(0,0,0,0.35);
  }
  .logo { color: #00e676; font-weight: 700; margin-bottom: 0.75rem; }
  .icon { font-size: 2rem; margin-bottom: 0.5rem; }
  h1 { font-size: 1.25rem; color: #69f0ae; margin-bottom: 0.6rem; }
  p { color: #a5d6a7; font-size: 0.98rem; }
  .msg {
    margin: 1rem 0 1.2rem;
    padding: 0.85rem 0.9rem;
    border-radius: 12px;
    background: #0c1f16;
    border: 1px dashed #2a4a38;
    color: #c8e6c9;
    font-size: 1.05rem;
  }
  button {
    border: 1px solid #1f3d2e;
    background: #0c1f16;
    color: #00e676;
    padding: 0.7rem 1.1rem;
    border-radius: 10px;
    font: inherit;
    cursor: pointer;
  }
  .hint { margin-top: 0.9rem; font-size: 0.85rem; color: #81c784; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">MCD Code Up</div>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>اینترنت قطع شده</h1>
    <div class="msg">ناموسا اینترنت رو روشن کن 😄</div>
    <p>تا نت وصل نشه نمی‌تونیم درس‌ها و تمرین‌ها رو برات بیاریم.</p>
    <p style="margin-top:0.6rem">
      <button type="button" id="retry">دوباره تلاش کن</button>
    </p>
    <p class="hint">وقتی آنلاین شدی، همین دکمه یا رفرش صفحه کافیه.</p>
  </div>
  <script>
    document.getElementById("retry").onclick = function () {
      if (navigator.onLine) location.href = "index.html";
      else location.reload();
    };
    window.addEventListener("online", function () {
      location.href = "index.html";
    });
  </script>
</body>
</html>
