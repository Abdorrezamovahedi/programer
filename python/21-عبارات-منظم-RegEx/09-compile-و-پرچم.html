<h1>compile و پرچم‌ها</h1>
<p>با <code>compile</code> الگو را از پیش می‌سازی. <code>IGNORECASE</code> حروف بزرگ و کوچک را یکی می‌گیرد.</p>
<div class="code">import re
pat = re.compile(r"python", re.IGNORECASE)
print(bool(pat.search("I love PYTHON")))</div>
