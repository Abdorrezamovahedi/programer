<ul><li><code>.</code> تقریباً هر کاراکتر</li><li><code>^</code> ابتدای رشته</li><li><code>$</code> انتهای رشته</li></ul>
<div class="code">import re

print(bool(re.search(r"دنیا$", "سلام دنیا")))</div>
