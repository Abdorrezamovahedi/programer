<h1>تعداد تکرار</h1>
<ul><li><code>*</code> صفر یا بیشتر</li><li><code>+</code> یک یا بیشتر</li><li><code>?</code> صفر یا یک</li><li><code>{m,n}</code> بازه</li></ul>
<p>تفاوت <code>\d</code> و <code>\d+</code>: اولی یک رقم، دومی دنباله رقم.</p>
<div class="code">import re
print(re.findall(r"\d+", "12 3 456"))
print(re.findall(r"\d{2,3}", "1 22 333 4444"))</div>
