<h1>حلقه while</h1>
<p><strong>هدف:</strong> کاری را تا وقتی شرط برقرار است تکرار کنی.</p>
<div class="code">n = 1
while n <= 3:
    print(n)
    n = n + 1
print("پایان")</div>
<div class="exp line-exp"><div class="exp-title">توضیح خط‌به‌خط</div>
<ol class="line-exp-list">
<li><span class="ln">خط 1</span><code class="ln-code">n = 1</code><span class="ln-exp">شمارنده.</span></li>
<li><span class="ln">خط 2</span><code class="ln-code">while n &lt;= 3</code><span class="ln-exp">تا n حداکثر ۳ ادامه بده.</span></li>
<li><span class="ln">خط 4</span><code class="ln-code">n = n + 1</code><span class="ln-exp">شمارنده را جلو ببر.</span></li>
</ol></div>
