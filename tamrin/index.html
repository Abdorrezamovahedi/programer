<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1419">
  <title>تمرین‌های عملی | مدرسه برنامه‌نویسان</title>
  <meta name="description" content="تمرین برنامه‌نویسی با راهنمای مرحله‌ای — بدون پاسخ آماده.">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
  <a class="skip-link" href="#main-content">پرش به محتوای اصلی</a>

  <header>
    <div class="logo"><a href="../index.html">مدرسه برنامه‌نویسان</a> <span>یادگیری واقعی · تمرین با راهنمای
        انسانی</span></div>
    <nav>
      <a href="../index.html">خانه</a>
      <a href="../tamrin/index.html" class="active">تمرین</a>
    </nav>
  </header>
  <main id="main-content">
    <div class="wrap">
      <div id="exLangSelect">
        <div class="hero">
          <h1>تمرین‌های عملی</h1>
          <p>راهنما هست؛ جواب آماده نه</p>
        </div>
        <div class="langs" id="tamrinLangs"></div>
        <div class="exercise-toolbar">
          <button type="button" id="btnShowQuiz" class="trybtn quiz-compact-button">آزمون سراسری</button>
        </div>
      </div>

      <div id="exListView" class="exercise-main-layout is-hidden">
        <div class="hero">
          <h1 id="exListTitle">تمرین‌ها</h1>
        </div>

        <div class="exercise-panel card">
          <div class="exercise-filter-row">
            <select id="exFilterLevel" class="filter-select">
              <option value="all">همه سطوح</option>
              <option value="easy">آسان</option>
              <option value="medium">متوسط</option>
              <option value="hard">سخت</option>
            </select>
            <select id="exFilterTopic" class="filter-select">
              <option value="all">همه موضوعات</option>
            </select>
          </div>
          <input type="search" id="exSearch" class="exercise-search" placeholder="جستجو...">
        </div>

        <div id="exListRoot"></div>
        <button type="button" id="backToExLangs" class="secondary-action">← بازگشت</button>
      </div>

      <div id="exDetailView" class="exercise-detail-layout is-hidden">
        <article class="card" id="exDetailCard"></article>
        <div class="navbtn exercise-detail-actions">
          <button type="button" id="backToExList" class="secondary-action">← لیست</button>
        </div>
      </div>

      <div id="quizArea" class="quiz-panel is-hidden">
        <div class="hero">
          <h2>آزمون سراسری</h2>
        </div>
        <div id="scoreBox" class="quiz-summary"></div>
        <div id="quizRoot"></div>
        <button type="button" id="backTamrin" class="secondary-action">← بازگشت</button>
      </div>
    </div>
  </main>
  <button type="button" class="pin-fab" id="pinFab" aria-label="درس‌های پین‌شده">📌 پین‌شده‌ها <span class="badge"
      id="pinBadge">0</span></button>
  <div class="pin-panel" id="pinPanel">
    <header><b>📌 درس‌های پین‌شده</b><button type="button" id="pinPanelClose" aria-label="بستن">×</button></header>
    <div class="pin-list" id="pinList"></div>
  </div>
  <footer class="site-footer">مدرسه برنامه‌نویسان</footer>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/exercises.js"></script>
</body>

</html>
